# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Run by the security-audit workflow on a fresh resolve against the siblings pinned in
# .github/alice-siblings. No advisory is ignored here except the dated holds in
# scripts/advisory_holds.toml, which scripts/advisory_hold_guard.py keeps exact.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
unused-ignored-advisory = "deny"
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]

# workspace crates are not checked against the allow list
[licenses.private]
ignore = true

[[licenses.exceptions]]
name = "alice-crypto"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-db"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-analytics"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-det-math"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-serial"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-zip"
allow = ["LicenseRef-Proprietary"]

[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dependencies have no registry version
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# the alice-* dependencies are git (branch main, or one pinned commit for alice-sign); each repository the resolve reaches is listed
allow-git = [
    "https://github.com/ext-sakamoro/ALICE-Analytics",
    "https://github.com/ext-sakamoro/ALICE-Crypto",
    "https://github.com/ext-sakamoro/ALICE-DB",
    "https://github.com/ext-sakamoro/ALICE-DetMath",
    "https://github.com/ext-sakamoro/ALICE-Serial",
    "https://github.com/ext-sakamoro/ALICE-Sign",
    "https://github.com/ext-sakamoro/ALICE-Zip",
]
